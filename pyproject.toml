[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fia-research"
version = "2.0.0"
description = "Find, Inject, Attack: reproducible core for distilled-data backdoor research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "Pillow>=9.1"]

[project.scripts]
fia = "fia.__main__:main"

[tool.setuptools.packages.find]
include = ["fia*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
fia = ["LICENSE.vicreg"]
